<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Accepter lâ€™invitation â€” Privalyse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #1e293b,
          #020617 65%
        );
      color: #f8fafc;
    }

    .card {
      width: 100%;
      max-width: 470px;
      padding: 36px;
      border: 1px solid #334155;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.96);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.45);
    }

    .brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .brand span {
      color: #38bdf8;
    }

    .brand p {
      margin: 10px 0 0;
      color: #94a3b8;
      line-height: 1.5;
    }

    .invitation-details {
      margin-bottom: 26px;
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 7px 0;
    }

    .detail-label {
      color: #94a3b8;
    }

    .detail-value {
      text-align: right;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      outline: none;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      min-height: 22px;
      margin: 18px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      color: #fca5a5;
    }

    .message.success {
      color: #86efac;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="brand">
      <h1>Termin<span>IA</span>tor</h1>

      <p>
        Acceptez votre invitation et crÃ©ez
        votre compte sÃ©curisÃ©.
      </p>
    </header>

    <p
      id="loading-message"
      class="message"
    >
      VÃ©rification de lâ€™invitationâ€¦
    </p>

    <section
      id="invitation-content"
      class="hidden"
    >
      <div class="invitation-details">
        <div class="detail">
          <span class="detail-label">
            Organisation
          </span>

          <span
            id="tenant-name"
            class="detail-value"
          ></span>
        </div>

        <div class="detail">
          <span class="detail-label">
            Adresse email
          </span>

          <span
            id="invitation-email"
            class="detail-value"
          ></span>
        </div>

        <div class="detail">
          <span class="detail-label">
            RÃ´le
          </span>

          <span
            id="invitation-role"
            class="detail-value"
          ></span>
        </div>
      </div>

      <form id="acceptance-form">
        <div class="field">
          <label for="password">
            Choisissez un mot de passe
          </label>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="200"
            required
          >
        </div>

        <div class="field">
          <label for="password-confirmation">
            Confirmez le mot de passe
          </label>

          <input
            id="password-confirmation"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="200"
            required
          >
        </div>

        <button
          id="submit-button"
          type="submit"
        >
          CrÃ©er mon compte
        </button>
      </form>
    </section>

    <p
      id="result-message"
      class="message"
      aria-live="polite"
    ></p>
  </main>

  <script>
    const parameters =
      new URLSearchParams(
        window.location.search
      );

    const token =
      parameters.get('token') || '';

    const loadingMessage =
      document.getElementById(
        'loading-message'
      );

    const invitationContent =
      document.getElementById(
        'invitation-content'
      );

    const resultMessage =
      document.getElementById(
        'result-message'
      );

    const form =
      document.getElementById(
        'acceptance-form'
      );

    const submitButton =
      document.getElementById(
        'submit-button'
      );

    function displayError(message) {
      loadingMessage.classList.add(
        'hidden'
      );

      resultMessage.textContent =
        message;

      resultMessage.className =
        'message error';
    }

    async function loadInvitation() {
      if (!token) {
        displayError(
          'Le lien dâ€™invitation est incomplet.'
        );

        return;
      }

      try {
        const response = await fetch(
          '/api/invitations/validate',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json',
            },

            body: JSON.stringify({
              token,
            }),
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            'Invitation invalide.'
          );
        }

        document.getElementById(
          'tenant-name'
        ).textContent =
          data.invitation.tenant.name;

        document.getElementById(
          'invitation-email'
        ).textContent =
          data.invitation.email;

        document.getElementById(
          'invitation-role'
        ).textContent =
          data.invitation.role;

        loadingMessage.classList.add(
          'hidden'
        );

        invitationContent.classList.remove(
          'hidden'
        );
      } catch (error) {
        displayError(error.message);
      }
    }

    form.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        resultMessage.textContent = '';
        resultMessage.className =
          'message';

        const password =
          document.getElementById(
            'password'
          ).value;

        const confirmation =
          document.getElementById(
            'password-confirmation'
          ).value;

        if (password.length < 8) {
          displayError(
            'Le mot de passe doit contenir au moins 8 caractÃ¨res.'
          );

          return;
        }

        if (password !== confirmation) {
          displayError(
            'Les deux mots de passe ne correspondent pas.'
          );

          return;
        }

        submitButton.disabled = true;
        submitButton.textContent =
          'CrÃ©ation du compteâ€¦';

        try {
          const response = await fetch(
            '/api/invitations/accept',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json',
              },

              body: JSON.stringify({
                token,
                password,
              }),
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              'CrÃ©ation du compte impossible.'
            );
          }

          invitationContent.classList.add(
            'hidden'
          );

          resultMessage.textContent =
            'Compte crÃ©Ã©. Redirection vers la connexionâ€¦';

          resultMessage.className =
            'message success';

          window.setTimeout(() => {
            window.location.replace(
              '/login.html'
            );
          }, 1500);
        } catch (error) {
          resultMessage.textContent =
            error.message;

          resultMessage.className =
            'message error';

          submitButton.disabled = false;
          submitButton.textContent =
            'CrÃ©er mon compte';
        }
      }
    );

    loadInvitation();
  </script>
</body>
</html>
