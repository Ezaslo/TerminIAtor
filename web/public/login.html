      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #0284c7;
      color: white;
      font-size: 15px;
      font-weight: 700;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      min-height: 22px;
      margin: 18px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      color: #fca5a5;
    }

    .message.success {
      color: #86efac;
    }

    .security-note {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      color: #64748b;

      line-height: 1.5;

    .mfa-login-panel {

      border: 1px solid #334155;

    .mfa-login-panel p { color: #cbd5e1; line-height: 1.5; }
    .mfa-login-panel input { margin: 8px 0 14px; }

    .mfa-login-panel button { margin-top: 8px; }
    .mfa-login-panel #mfa-recovery-toggle { background: #334155; }

    .mfa-login-panel #mfa-back:hover { background: #1e293b; color: #f8fafc; }

    button:focus-visible, input:focus-visible { outline: 3px solid rgba(56, 189, 248, 0.65); outline-offset: 2px; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .login-card, .mfa-login-panel { padding: 24px 20px; }
    }

</head>
