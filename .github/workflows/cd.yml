name: TerminIAtor CD

on:
  workflow_run:
    workflows:
      - "TerminIAtor CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app.prydena.fr
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: Prod
      url: https://app.prydena.fr

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: 178.104.251.72
          PROD_SSH_KEY: ${{ secrets.SSH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          PROD_HOST: 178.104.251.72
        run: |
          ssh "enzo@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/privalyse-git

          rollback() {
            status=$?
            trap - ERR

            echo "Deployment failed. Rolling back application image..."

            if docker image inspect privalyse:rollback >/dev/null 2>&1; then
              docker tag privalyse:rollback privalyse:production
              docker compose up -d --no-deps --no-build --force-recreate privalyse
              echo "Application image rolled back."
            else
              echo "No rollback image available."
            fi

            exit "$status"
          }

          git fetch origin main
          DEPLOY_SHA="$(git rev-parse FETCH_HEAD)"
          DEPLOY_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEPLOY_DIR"' EXIT

          echo "Deploying $DEPLOY_SHA"

          # Keep the currently running application image as the rollback target.
          docker image inspect privalyse:production >/dev/null
          docker tag privalyse:production privalyse:rollback

          trap rollback ERR

          git archive "$DEPLOY_SHA" Dockerfile web | tar -x -C "$DEPLOY_DIR"

          docker build             -t privalyse:production             -f "$DEPLOY_DIR/Dockerfile"             "$DEPLOY_DIR/web"

          docker compose run --rm --no-deps privalyse node src/database/migrate.js
          docker compose up -d --no-deps --no-build --force-recreate privalyse

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health/ready >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "Local health check failed."
            docker compose logs --tail=100 privalyse
            false
          fi

          curl --fail --silent --show-error https://app.prydena.fr/health/ready >/dev/null

          trap - ERR
          echo "Deployment successful: $DEPLOY_SHA"
          REMOTE

      - name: Verify public endpoint
        run: curl --fail --silent --show-error https://app.prydena.fr/health/ready >/dev/null
