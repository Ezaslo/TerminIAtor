  postgres:
    image: postgres:17-bookworm
    container_name: privalyse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: privalyse
      POSTGRES_USER: privalyse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privalyse -d privalyse"]
      interval: 5s
      timeout: 5s
      retries: 10

  privalyse:
    build:
      context: ./web
      dockerfile: Dockerfile

    image: privalyse:production
    container_name: privalyse-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_PROXY_PORT: 3002
      DATABASE_URL: postgresql://privalyse:${POSTGRES_PASSWORD}@postgres:5432/privalyse
      DATABASE_SSL: "false"

    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"

    volumes:
      - ./data/terraform-sessions:/app/terraform-sessions

  caddy:
    image: caddy:2-alpine
    container_name: privalyse-caddy
    restart: unless-stopped

    depends_on:
      - privalyse

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
